name: Specifications

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  specifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Status claims
        id: claims
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INTEGRATION_BRANCH: __UP_INTEGRATION_BRANCH__
          BEFORE: ${{ github.event.before }}
        run: |
          SINCE=
          if [ "$EVENT" = pull_request ]; then
            SINCE="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            SINCE="$BEFORE"
          fi
          printf 'since=%s\n' "$SINCE" >> "$GITHUB_OUTPUT"
          if [ -n "$SINCE" ]; then
            set -- --since "$SINCE"
            if [ "$EVENT" = pull_request ] || [ "$REF_NAME" = "$DEFAULT_BRANCH" ] || { [ -n "$INTEGRATION_BRANCH" ] && [ "$REF_NAME" = "$INTEGRATION_BRANCH" ]; }; then
              set -- "$@" --base "$SINCE"
            fi
          else
            set -- --first-push
          fi
          python3 tools/specs/status_claims.py "$@"

      - name: Lint the specifications
        run: python3 tools/specs/spec_lint.py --gate

      - name: Spec-first guard
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INTEGRATION_BRANCH: __UP_INTEGRATION_BRANCH__
          SINCE: ${{ steps.claims.outputs.since }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          MODE=warn
          if [ "$EVENT" = pull_request ] || [ "$REF_NAME" = "$DEFAULT_BRANCH" ] || { [ -n "$INTEGRATION_BRANCH" ] && [ "$REF_NAME" = "$INTEGRATION_BRANCH" ]; }; then
            MODE=block
          fi
          GUARD_BASE="$SINCE"
          if [ -z "$GUARD_BASE" ]; then
            if git rev-parse --verify --quiet 'HEAD~1^{commit}' >/dev/null; then
              GUARD_BASE=HEAD~1
            else
              # A root commit is compared with Git's empty tree, in the repository's object format.
              GUARD_BASE="$(git hash-object -w -t tree --stdin </dev/null)"
            fi
          fi
          MESSAGE_FILE="$RUNNER_TEMP/specification-messages.txt"
          if [ "$EVENT" = pull_request ]; then
            printf '%s' "$PR_BODY" > "$MESSAGE_FILE"
          elif [ -n "$SINCE" ]; then
            git log --format=%B "$SINCE..HEAD" > "$MESSAGE_FILE"
          else
            git log -1 --format=%B HEAD > "$MESSAGE_FILE"
          fi
          python3 tools/specs/spec_first_guard.py --base "$GUARD_BASE" --message-file "$MESSAGE_FILE" --mode "$MODE"
